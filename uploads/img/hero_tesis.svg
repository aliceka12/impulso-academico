<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042152"/>
      <stop offset="55%" stop-color="#07347A"/>
      <stop offset="100%" stop-color="#0074F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02112B" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="800" height="600" rx="28" fill="url(#bgGrad)"/>
  <circle cx="690" cy="100" r="150" fill="#0074F0" opacity="0.18"/>
  <circle cx="100" cy="510" r="190" fill="#3898FF" opacity="0.15"/>

  <!-- Main Card -->
  <g filter="url(#shadow)">
    <rect x="65" y="55" width="670" height="460" rx="26" fill="#FFFFFF"/>
    <rect x="65" y="55" width="670" height="58" rx="26" fill="#F2F7FF"/>
    <circle cx="102" cy="84" r="8" fill="#042152"/>
    <circle cx="126" cy="84" r="8" fill="#0074F0"/>
    <circle cx="150" cy="84" r="8" fill="#5CA9FF"/>
    <text x="415" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#042152" text-anchor="middle">IMPULSO ACADÉMICO • SISTEMA DE GESTIÓN Y APOYO A LA INVESTIGACIÓN</text>
  </g>

  <!-- Left Side: Circular Double Ring IA Emblem -->
  <g transform="translate(245, 290)">
    <circle cx="0" cy="0" r="138" fill="#FFFFFF" stroke="#0074F0" stroke-width="6"/>
    <circle cx="0" cy="0" r="127" fill="none" stroke="#0074F0" stroke-width="3"/>
    
    <!-- "I" Column in Deep Navy -->
    <path d="M -68 -55 L -40 -55 L -40 35 L -52 55 L -68 55 Z" fill="#042152"/>
    
    <!-- "A" with Swoosh in Royal Blue -->
    <path d="M -25 25 L 5 -52 L 36 -52 L 74 55 L 44 55 L 28 15 C 5 22 -15 35 -28 55 L -44 55 C -30 30 -5 12 48 0 C 20 2 -5 12 -25 25 Z" fill="#0074F0"/>
    <polygon points="10,-25 22,-25 32,2 0,10" fill="#FFFFFF"/>

    <!-- Graduation Cap on top of A -->
    <g transform="translate(20, -82)">
      <polygon points="0,-24 58,0 0,24 -58,0" fill="#042152"/>
      <path d="M -24,6 L -24,22 C -24,32 24,32 24,22 L 24,6 L 0,16 Z" fill="#042152"/>
      <line x1="48" y1="4" x2="48" y2="32" stroke="#042152" stroke-width="4" stroke-linecap="round"/>
      <path d="M 43,32 L 53,32 L 56,46 L 40,46 Z" fill="#042152"/>
    </g>

    <text x="0" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="900" fill="#042152" text-anchor="middle">Impulso</text>
    <text x="0" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="900" fill="#0074F0" text-anchor="middle">Académico</text>
  </g>

  <!-- Right Side Feature Cards -->
  <g transform="translate(425, 148)">
    <rect x="0" y="0" width="275" height="86" rx="16" fill="#F2F7FF" stroke="#CFE3FF" stroke-width="2"/>
    <circle cx="42" cy="43" r="24" fill="#0074F0"/>
    <path d="M 32 43 L 40 51 L 54 35" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="78" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#042152">100% Tesis Aprobadas</text>
    <text x="78" y="59" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3B5980">Pregrado, Maestría y Doctorado</text>

    <rect x="0" y="106" width="275" height="86" rx="16" fill="#F2F7FF" stroke="#CFE3FF" stroke-width="2"/>
    <circle cx="42" cy="149" r="24" fill="#042152"/>
    <text x="42" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#5CA9FF" text-anchor="middle">IA</text>
    <text x="78" y="144" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#042152">Turnitin &lt; 10% y APA 7</text>
    <text x="78" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#3B5980">Originalidad y rigor científico</text>

    <rect x="0" y="212" width="275" height="86" rx="16" fill="#042152"/>
    <circle cx="42" cy="255" r="24" fill="#0074F0"/>
    <text x="42" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">A+</text>
    <text x="78" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Coordinación Directa</text>
    <text x="78" y="271" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#7AB8FF">Facilidades de pago por interno</text>
  </g>

  <!-- Bottom Pill -->
  <rect x="145" y="486" width="510" height="54" rx="27" fill="#0074F0" filter="url(#shadow)"/>
  <text x="400" y="519" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">SISTEMA DE GESTIÓN Y APOYO A LA INVESTIGACIÓN</text>
</svg>
